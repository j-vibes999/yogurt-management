services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yogurt_ops
    ports:
      - "5432:5432"
    volumes:
      - yogurt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yogurt_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  yogurt_postgres_data:
