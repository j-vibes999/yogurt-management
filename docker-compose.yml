# Optional local PostgreSQL for development (production uses the Homebrew service).
# Set POSTGRES_PASSWORD in your shell or a .env file next to this file before `docker compose up`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: yogurt_ops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yogurt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yogurt_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  yogurt_postgres_data:
